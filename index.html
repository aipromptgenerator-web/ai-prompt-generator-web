<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Prompt Video AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap">
<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#1b1e2b;--mute:#626780;--line:#d9dce8;--acc:#4b3fe0;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e2a;--ink:#eceef6;--mute:#9aa0b8;--line:#2e3243;--acc:#8f86ff;--accink:#12141c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 4px;letter-spacing:-.02em}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
label:first-child{margin-top:0}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
.primary{background:var(--acc);color:var(--accink);width:100%;margin-top:18px}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:8px 14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#out{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;min-height:80px;margin:0 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.tools a{display:inline-block;margin:6px 10px 0 0;color:var(--acc);font-weight:600}
small{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Generator Prompt Video AI</h1>
  <p class="sub">Isi idenya, pilih gaya, lalu salin prompt ke Veo, Kling, Runway, atau Sora.</p>

  <section class="card">
    <label for="idea">Ide adegan (bahasa bebas)</label>
    <textarea id="idea" placeholder="Contoh: kucing oranye berlari di atas atap kota saat hujan"></textarea>

    <div class="row">
      <div><label for="style">Gaya visual</label>
        <select id="style">
          <option>cinematic, photorealistic</option>
          <option>anime, hand-drawn</option>
          <option>3D animation, Pixar-like</option>
          <option>documentary, handheld</option>
          <option>vintage film, 35mm grain</option>
          <option>claymation, stop motion</option>
        </select></div>
      <div><label for="cam">Gerak kamera</label>
        <select id="cam">
          <option>slow dolly in</option>
          <option>drone aerial shot</option>
          <option>tracking shot</option>
          <option>static wide shot</option>
          <option>orbit around subject</option>
          <option>handheld close-up</option>
        </select></div>
    </div>

    <div class="row">
      <div><label for="light">Pencahayaan</label>
        <select id="light">
          <option>golden hour light</option>
          <option>soft overcast light</option>
          <option>neon night lighting</option>
          <option>dramatic low-key lighting</option>
          <option>bright studio lighting</option>
        </select></div>
      <div><label for="mood">Suasana</label>
        <select id="mood">
          <option>epic and energetic</option>
          <option>calm and peaceful</option>
          <option>mysterious and tense</option>
          <option>warm and nostalgic</option>
          <option>fun and playful</option>
        </select></div>
    </div>

    <div class="row">
      <div><label for="dur">Durasi</label>
        <select id="dur"><option>5 seconds</option><option>8 seconds</option><option>10 seconds</option></select></div>
      <div><label for="ratio">Rasio</label>
        <select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
    </div>

    <button class="primary" id="gen">Buat prompt</button>
  </section>

  <section class="card">
    <label>Hasil prompt</label>
    <div id="out">Prompt akan muncul di sini.</div>
    <div class="bar">
      <button class="ghost" id="copy">Salin</button>
      <button class="ghost" id="rnd">Acak ide</button>
    </div>
    <p class="tools"><small>Buka tool:</small><br>
      <a href="https://labs.google/fx/tools/flow" target="_blank" rel="noopener">Veo / Flow</a>
      <a href="https://klingai.com" target="_blank" rel="noopener">Kling</a>
      <a href="https://runwayml.com" target="_blank" rel="noopener">Runway</a>
      <a href="https://sora.chatgpt.com" target="_blank" rel="noopener">Sora</a>
    </p>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ideas = [
    "seekor rubah salju berlari melewati hutan pinus berkabut",
    "robot tua menyiram bunga di balkon apartemen futuristik",
    "pasar malam di Jakarta saat hujan, lampu neon memantul di genangan",
    "astronot berjalan di gurun merah dengan dua bulan di langit",
    "penjual kopi keliling mengayuh sepeda di jalan desa saat fajar"
  ];

  function build() {
    var idea = $("idea").value.trim();
    if (!idea) { $("out").textContent = "Isi ide adegan dulu."; return ""; }
    var p = idea + ". " +
      $("style").value + ". Camera: " + $("cam").value + ". " +
      "Lighting: " + $("light").value + ". Mood: " + $("mood").value + ". " +
      "Duration " + $("dur").value + ", aspect ratio " + $("ratio").value + ". " +
      "Smooth natural motion, high detail, consistent subject, no text, no watermark.";
    $("out").textContent = p;
    return p;
  }

  $("gen").addEventListener("click", build);

  $("rnd").addEventListener("click", function () {
    $("idea").value = ideas[Math.floor(Math.random() * ideas.length)];
    build();
  });

  $("copy").addEventListener("click", function () {
    var t = $("out").textContent;
    var btn = $("copy");
    function ok() { btn.textContent = "Tersalin"; setTimeout(function () { btn.textContent = "Salin"; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok, function () { alert("Salin manual ya."); });
    } else { alert("Salin manual ya."); }
  });
})();
</script>
</body>
</html>
